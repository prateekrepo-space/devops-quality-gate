name: CI/CD Quality Gate Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: Code Quality & Unit Testing
  # ============================================================================
  unit-tests:
    name: "Stage 1: Unit Tests (Python/FastAPI)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v tests/

  # ============================================================================
  # STAGES 2-4: Free Quality Gate Engine
  # ============================================================================
  quality-gate:
    name: "Stages 2-4: Free Quality Gate Engine"
    needs: unit-tests
    uses: ./.github/workflows/quality-gate.yml
    with:
      port: "8000"
      health_path: "/health"
      load_test_path: "/items"
      max_latency_ms: 300
      connections: 30
      duration: 10
